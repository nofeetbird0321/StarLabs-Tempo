version: '3.8'

services:
  tempo-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: starlabs-tempo-bot
    restart: unless-stopped
    volumes:
      # Mount data directory to persist data
      - ./data:/app/data
      # Mount logs directory to persist logs
      - ./logs:/app/logs
      # Mount config to allow external configuration
      - ./config.yaml:/app/config.yaml:ro
    environment:
      # Set timezone (optional)
      - TZ=UTC
      # Python unbuffered mode for real-time logs
      - PYTHONUNBUFFERED=1
      # Auto-select menu option (default: 1 for "Start farming")
      # Change to 2 for "Edit config", 3 for "Database actions", etc.
      - AUTO_SELECT_OPTION=1
    # Uncomment to run in detached mode
    # stdin_open: true
    # tty: true
